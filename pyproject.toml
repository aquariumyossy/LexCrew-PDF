[project]
name = "lexcrew-pdf"
version = "1.4.1"
description = "証拠番号付き PDF をカードから書く"
requires-python = ">=3.11"
dependencies = [
    "pymupdf==1.28.2",
    "pywebview==6.2.1",
]

[project.scripts]
lexcrew-pdf = "lexcrew_pdf.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
