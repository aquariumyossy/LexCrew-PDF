<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>LexCrew-PDF</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fc;
      --line: #d5deef;
      --text: #1a2438;
      --muted: #62718f;
      --accent: #2f6fd6;
      --warn: #b8860b;
      --danger: #c43f52;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: radial-gradient(1200px 600px at 10% -20%, #dce8ff 0%, transparent 70%), var(--bg);
      color: var(--text);
      font-size: 15px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 16px 8px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(244, 247, 252, 0.94);
    }
    h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 700; }
    select, input { font: inherit; color: inherit; }
    select, .series-input {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 7px 8px;
    }
    .series-field { position: relative; width: 13.5em; }
    .series-input { width: 100%; padding-right: 1.8em; }
    .series-open {
      position: absolute;
      right: 1px;
      top: 1px;
      bottom: 1px;
      width: 1.6em;
      border: 0;
      border-radius: 0 7px 7px 0;
      background: transparent;
      padding: 0;
      color: var(--muted);
    }
    .series-menu {
      position: absolute;
      z-index: 5;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      margin: 0;
      padding: 4px 0;
      list-style: none;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(26, 36, 56, 0.12);
    }
    .series-menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 6px 10px;
    }
    .series-menu button:hover,
    .series-menu button.is-current { background: #e7f0ff; }
    button, .btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f5f8ff;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover, .btn:hover { background: #e8f0ff; }
    button:disabled { opacity: 0.5; cursor: default; }
    .btn.mini {
      font-size: 12px;
      padding: 3px 7px;
      line-height: 1.2;
      border-radius: 6px;
    }
    .btn.primary {
      border-color: #72a0eb;
      background: #eaf2ff;
      color: var(--accent);
    }
    .btn.primary:hover { background: #d6e4ff; }
    .btn.danger {
      border-color: #e8828e;
      background: #fff0f1;
      color: var(--danger);
    }
    #generate { margin-left: auto; }
    #output { flex: 1 1 220px; margin: 0; font-size: 12px; color: var(--muted); }
    #banner { margin: 0 16px 10px; font-size: 13px; }
    #cards {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-content: flex-start;
      align-items: flex-start;
      padding: 2px 16px 24px;
    }
    .evidence-card {
      width: 280px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .evidence-open {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #fff;
      cursor: pointer;
      text-align: left;
    }
    .evidence-open:hover,
    .evidence-open:focus-visible,
    .drop {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .evidence-open img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 210 / 297;
      object-fit: contain;
      background: #fff;
    }
    .evidence-sheet {
      position: relative;
      aspect-ratio: 210 / 297;
      background: #fff;
    }
    .evidence-sheet-empty { background: #f7f9fc; }
    .evidence-sheet-empty > .evidence-add {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
    }
    .evidence-meta { padding: 8px 10px 10px; }
    .evidence-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }
    input.evidence-name {
      display: block;
      width: 100%;
      margin-top: 2px;
      padding: 0;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }
    input.evidence-name:focus {
      outline: 1px solid var(--accent);
      border-radius: 4px;
    }
    .evidence-source,
    .evidence-pages {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }
    .evidence-actions {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .reorder-handle {
      margin-left: auto;
      width: 22px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      display: grid;
      grid-template-columns: repeat(2, 3px);
      grid-template-rows: repeat(3, 3px);
      gap: 2px;
      place-content: center;
      cursor: grab;
      flex: 0 0 auto;
    }
    .reorder-handle:active { cursor: grabbing; }
    .reorder-handle span {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #7d92b2;
    }
    .evidence-card.is-dragging { opacity: 0.55; }
    #reorder-marker {
      position: fixed;
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
      pointer-events: none;
      z-index: 20;
    }
    .evidence-split.is-on {
      border-color: #72a0eb;
      background: #d6e4ff;
      color: var(--accent);
    }
    .evidence-rotation { font-size: 12px; color: var(--muted); }
    .evidence-message { color: var(--danger); font-size: 12px; margin: 6px 0 0; }
    .evidence-card.is-locked { border-color: #9db7e8; }
    .evidence-lock {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }
    .evidence-card.is-locked .evidence-actions button:disabled,
    .evidence-card.is-locked .evidence-name:disabled,
    .evidence-card.is-locked .evidence-add:disabled {
      opacity: 0.45;
    }
    .add-card {
      width: 280px;
      min-height: 148px;
      border: 1px dashed var(--line);
      background: #fff;
      color: var(--accent);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>LexCrew-PDF</h1>
    <div class="series-field">
      <input id="series" class="series-input" aria-label="証拠番号の形" spellcheck="false" autocomplete="off" />
      <button id="series-open" class="series-open" type="button" aria-label="番号の形の一覧" aria-expanded="false">▼</button>
      <ul id="series-menu" class="series-menu" hidden>
        <li><button type="button" data-value="甲第N号証">甲第N号証</button></li>
        <li><button type="button" data-value="乙第N号証">乙第N号証</button></li>
        <li><button type="button" data-value="丙第N号証">丙第N号証</button></li>
        <li><button type="button" data-value="疎甲第N号証">疎甲第N号証</button></li>
        <li><button type="button" data-value="疎乙第N号証">疎乙第N号証</button></li>
        <li><button type="button" data-value="疎丙第N号証">疎丙第N号証</button></li>
        <li><button type="button" data-value="別紙N">別紙N</button></li>
        <li><button type="button" data-value="資料N">資料N</button></li>
      </ul>
    </div>
    <p id="output"></p>
    <button id="generate" class="btn primary" type="button">証拠PDFを生成</button>
  </header>
  <p id="banner" hidden></p>
  <main id="cards"></main>
  <script src="app.js"></script>
</body>
</html>
